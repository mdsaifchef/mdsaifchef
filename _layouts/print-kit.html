---
layout: default
---
{% for item in site.data.print_kit.templates %}
  {% if page.kit_group == 'all' or page.kit_group == item.id or page.kit_group == item.category %}
<section class="sheet kit-sheet kit-{{ item.id }}{% if item.category == 'Payments' %} kit-payment{% endif %}"
  id="{{ item.id }}" aria-label="{{ item.name }}" data-guidance="{{ item.guidance | escape }}">
  {% include print-artwork.html item=item %}
</section>
  {% endif %}
{% endfor %}
<script src="{{ '/assets/js/lib/html2canvas-1.4.1.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/print-kit.js' | relative_url }}" defer></script>
