<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.kit_group %}<link rel="stylesheet" href="{{ '/assets/css/print-kit.css' | relative_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/themes/variant.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme-controls.css' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}" data-baseurl="{{ site.baseurl | escape }}"></script>
</head>
<body class="{{ page.body_class }}">
  {% include header.html %}
  <div class="page-layout">
    <details class="control-sidebar no-print" id="control-sidebar" open>
      <summary>Page controls</summary>
      <div class="control-sidebar-content">
        {% include theme-controls.html %}
        {% if page.kit_group %}{% include kit-controls.html %}{% endif %}
      </div>
    </details>
    <main>
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
</body>
</html>
